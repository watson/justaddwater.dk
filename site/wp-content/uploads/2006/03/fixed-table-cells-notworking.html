	<title></title>
<style type="text/css">
table{
	width:300px;
	border:1px dashed red;
}
td{
	vertical-align: top;
	background-color: #dfc;
	height: 10px;	/* table cell does not obey this height */

}
</style>

<body>

<table class="slimTable">	
<tr>
	<td>1. start cell not much content</td>
	<td>2. second cell has insanely long content that I know will always wrap</td>
</tr>
</table>

<script type="text/javascript">
var s = ['<div style="height:18px;text-overflow: ellipsis; overflow:hidden; width: 100%">', '</div>' ];
var c,b=[],a = $A(document.getElementsByClassName('slimTable'))
a.each( function(table){
	c = $A(table.getElementsByTagName('td'))
	c.each( function(node){
		b[b.length] = node;
	});
	c = null;
});

b.each( function(node) { node.innerHTML=s[0] + node.innerHTML + s[1]; } );

</script>


			
</body>
