<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">

<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en">
<head>
<title></title>
<style type="text/css">
table{
  table-layout:fixed;
  width:300px;
  border:1px dashed red;
}
td{
  vertical-align: top;
  background-color: #dfc;
  height: 10px;    /* table cells obey this height when table-layout is fixed, overflow is hidden and white-space is nowrap*/
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
</style>
</head>

<body>
  <p>I want table row to be the height of 1 text line.</p>
	<p>Table cells obey this height when table-layout is fixed, overflow is hidden and white-space is nowrap.</p>
<table>
<tr>
  <td>1. start cell not much content</td>
  <td>2. second cell has insanely long content that I know will always wrap</td>
</tr>
</table>
</body>
</html>
