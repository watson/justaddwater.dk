<html>
<head>
<meta content="text/html; charset=utf-8" http-equiv="Content-type"/>
<title>e-texteditor comment </title>

<body>
<h3>E-texteditor find panel</h3><small>Comment by <a href="/">Jesper Rønn-Jensen</a>, 2008-02-11 for E-texteditor v 1.0.11. <a href="http://www.e-texteditor.com/forum/viewtopic.php?t=433&amp;start=15">Forum thread #433</a>.
  </small><small>Assuming all buttons are equally wide (must not change size on keypress).</small>
<style type="text/css">
body{background-color:#ECE9D8}
.find{
  background: #fff url(http://justaddwater.dk/wp-content/uploads/2008/02/e-texteditor-magnify-glass.png) no-repeat top left;
  padding-left:25px;
}
.find-button{width: 70px}
.replace-button{ width: 130px}
</style>
<p>Normal state:<br/>
<label>Search: <input class="find"/> </label>
<button class="find-button" title="Go to next occurrence (ALT-N)"><u>N</u>ext</button>
<input/>
<button class="replace-button" title="Replace occurrence (ALT-R)"><u>R</u>eplace</button>
</p>
<hr/>
<p>Pressing shift:<br/>
<label>Search: <input class="find"/> </label>
<button class="find-button" title="Go to previous occurrence (ALT-P)"><u>P</u>revious</button>
<input/>
<button class="replace-button" title="Replace occurrence (ALT-R)"><u>R</u>eplace</button>
</p>
<hr/>
<p>Pressing ALT key:<br/>
<label>Search: <input class="find"/> </label>
<button class="find-button" title="Go to next occurrence (ALT-N)"><u>N</u>ext</button>
<input/>
<button class="replace-button" title="Replace occurrence (ALT-R)">Replace <u>A</u>ll</button>
</p>
<hr/>
<p>Pressing CTRL key:<br/>
<label>Search: <input class="find"/> </label>
<button class="find-button" title="Go to next occurrence (ALT-N)"><u>N</u>ext</button>
<input/>
<button class="replace-button" title="Replace occurrence (ALT-R)">Replace in <u>S</u>election</button>
</p>
<hr/>
</body>
</html>
