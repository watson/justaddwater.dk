{{ define "main" }}
<h1>{{ .Title }}</h1>
{{ range (where site.RegularPages "Type" "posts").GroupByDate "2006" "desc" }}
<h2>{{ .Key }}</h2>
<ul class="posts">{{ range .Pages.ByDate.Reverse }}<li><time>{{ .Date.Format "2006-01-02" }}</time> <a href="{{ .RelPermalink }}">{{ .Title }}</a></li>{{ end }}</ul>
{{ end }}
{{ end }}
