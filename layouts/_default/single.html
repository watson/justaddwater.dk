{{ define "main" }}
<article>
<h1>{{ .Title }}</h1>
{{ if eq .Type "posts" }}<p class="meta"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 January 2006" }}</time>
{{ range .Params.categories }} · <a href="/category/{{ . | urlize }}/">{{ . }}</a>{{ end }}</p>{{ end }}
{{ .Content }}
</article>
{{ partial "comments.html" . }}
{{ end }}
