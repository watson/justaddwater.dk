<!doctype html>
<html lang="{{ site.Language.Locale }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
<meta name="description" content="{{ with .Summary }}{{ . | plainify | truncate 160 }}{{ else }}{{ site.Params.description }}{{ end }}">
<link rel="alternate" type="application/rss+xml" href="/feed.xml" title="{{ site.Title }}">
{{ $css := resources.Get "site.css" | minify }}<link rel="stylesheet" href="{{ $css.RelPermalink }}">
</head>
<body>
<header><a class="brand" href="/">Just Add Water</a>
<nav><a href="/category/usability/">Usability</a> <a href="/categories/">Topics</a> <a href="/all-posts/">All posts</a> <a href="/feed.xml">RSS</a></nav></header>
<main>{{ block "main" . }}{{ end }}</main>
<footer>An archive of justaddwater.dk, 2005–2016 · by Jesper Rønn-Jensen</footer>
</body>
</html>
