baseURL = "https://justaddwater.dk/"
locale = "en"
publishDir = "site"   # generated site, committed (GitHub Pages publishes site/)
title = "Just Add Water"
pagerSize = 20
disableKinds = ["section"]
enableRobotsTXT = true

[taxonomies]
  category = "categories"
  tag = "tags"

[permalinks.taxonomy]
  categories = "/category/"
  tags = "/tag/"

[permalinks.term]
  categories = "/category/:slug/"
  tags = "/tag/:slug/"

# /feed/index.xml (served as /feed/); terms get /category/<x>/feed/index.xml.
# Legacy /feed.xml is handled by static/_redirects (301 -> /feed/).
[outputFormats.RSS]
  baseName = "feed/index"

[outputs]
  home = ["HTML", "RSS"]
  term = ["HTML", "RSS"]
  taxonomy = ["HTML"]
  page = ["HTML"]

[markup.goldmark.renderer]
  unsafe = true

[params]
  description = "Usability, web development and blogging, 2005–2016. An archive."
  archiveStartYear = 2005
  archiveEndYear = 2026
