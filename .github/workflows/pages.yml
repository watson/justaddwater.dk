name: Deploy static archive

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, closed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-preview-{0}', github.event.number) || 'github-pages' }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read
      pull-requests: write
    env:
      # Pull request previews are published below the archive, at /pr-preview/pr-<number>/.
      PREVIEW_PATH: ${{ github.event_name == 'pull_request' && format('/pr-preview/pr-{0}', github.event.number) || '' }}
    steps:
      - name: Check out archive
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Install test and validation dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements-audit.txt
      - name: Test asset capture and deployment URL rewriting
        run: .venv/bin/python -m unittest discover -s scripts -p 'test_*.py'
      - name: Check migration report against public recovery records
        run: .venv/bin/python scripts/migration_report.py --check
      - name: Prepare static files
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PAGES_SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: .venv/bin/python scripts/prepare_pages.py --base-path "$PAGES_BASE_PATH$PREVIEW_PATH" --site-url "$PAGES_SITE_URL$PREVIEW_PATH"
      - name: Validate the deployment
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: .venv/bin/python scripts/verify.py --site _site --base-path "$PAGES_BASE_PATH$PREVIEW_PATH"
      - name: Deploy
        if: github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: _site
          branch: gh-pages
          clean-exclude: pr-preview/
          force: false
      # The repository token cannot push previews for pull requests from forks; those are only validated.
      - name: Deploy pull request preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          source-dir: _site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          pages-base-url: ${{ steps.pages.outputs.host }}${{ steps.pages.outputs.base_path }}
          qr-code: false

  remove-preview:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out archive
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Remove pull request preview
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          preview-branch: gh-pages
          umbrella-dir: pr-preview
