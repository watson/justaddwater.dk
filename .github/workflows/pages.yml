name: Deploy static archive

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out archive
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Install test and validation dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements-audit.txt
      - name: Test asset capture and deployment URL rewriting
        run: .venv/bin/python -m unittest discover -s scripts -p 'test_*.py'
      - name: Check migration report against public recovery records
        run: .venv/bin/python scripts/migration_report.py --check
      - name: Prepare static files
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PAGES_SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: .venv/bin/python scripts/prepare_pages.py --base-path "$PAGES_BASE_PATH" --site-url "$PAGES_SITE_URL"
      - name: Validate the deployment
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: .venv/bin/python scripts/verify.py --site _site --base-path "$PAGES_BASE_PATH"
      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
